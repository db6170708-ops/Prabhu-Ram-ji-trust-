<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0e3f30" />
      <stop offset="70%" stop-color="#07241b" />
      <stop offset="100%" stop-color="#041610" />
    </radialGradient>

    <!-- Metallic Gold Outer Ring Gradient -->
    <linearGradient id="goldRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d061" />
      <stop offset="25%" stop-color="#e5a93b" />
      <stop offset="50%" stop-color="#fff1b0" />
      <stop offset="75%" stop-color="#d49428" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <!-- Metallic Gold Text Gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0a8" />
      <stop offset="35%" stop-color="#f5ba42" />
      <stop offset="70%" stop-color="#e09924" />
      <stop offset="100%" stop-color="#a66a11" />
    </linearGradient>

    <!-- Cream Gold for Ram -->
    <linearGradient id="creamGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fff5c7" />
      <stop offset="100%" stop-color="#f2d279" />
    </linearGradient>

    <!-- Soft Gold Halo Glow Filter -->
    <filter id="haloGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Bottom Arc Path for Circular Text -->
    <path id="bottomTextArc" d="M 120 512 A 392 392 0 0 0 904 512" fill="none" />
  </defs>

  <!-- Squircle Canvas Background (Matching Phone Launcher & PWA) -->
  <rect width="1024" height="1024" rx="224" fill="#041610" />

  <!-- Outer Deep Field -->
  <circle cx="512" cy="512" r="476" fill="url(#bgGrad)" />

  <!-- Outer Thick Gold Border -->
  <circle cx="512" cy="512" r="460" fill="none" stroke="url(#goldRingGrad)" stroke-width="26" />
  <circle cx="512" cy="512" r="473" fill="none" stroke="#664614" stroke-width="2" />
  <circle cx="512" cy="512" r="446" fill="none" stroke="#664614" stroke-width="3" />

  <!-- Dashed Stitch Circular Ring -->
  <circle cx="512" cy="512" r="418" fill="none" stroke="#fce588" stroke-width="6" stroke-dasharray="14 10" opacity="0.95" />

  <!-- Inner Concentric Solid Thin Gold Ring -->
  <circle cx="512" cy="512" r="392" fill="none" stroke="url(#goldRingGrad)" stroke-width="8" />

  <!-- Center Golden Circular Aura / Halo -->
  <circle cx="512" cy="505" r="145" fill="none" stroke="#d49428" stroke-width="7" opacity="0.45" filter="url(#haloGlow)" />
  <circle cx="512" cy="505" r="145" fill="none" stroke="#fce588" stroke-width="3" opacity="0.65" />

  <!-- Central Sacred "श्री" (Top Center) -->
  <text 
    x="512" 
    y="445" 
    font-family="'Noto Sans Devanagari', 'Noto Serif Devanagari', 'Mangal', 'Poppins', sans-serif" 
    font-size="160" 
    font-weight="900" 
    fill="url(#goldTextGrad)" 
    text-anchor="middle"
    filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.7))"
  >श्री</text>

  <!-- Central Sacred "राम" (Middle Center) -->
  <text 
    x="512" 
    y="635" 
    font-family="'Noto Sans Devanagari', 'Noto Serif Devanagari', 'Mangal', 'Poppins', sans-serif" 
    font-size="180" 
    font-weight="900" 
    fill="url(#creamGoldGrad)" 
    text-anchor="middle"
    filter="drop-shadow(0px 8px 20px rgba(0,0,0,0.8))"
    letter-spacing="2"
  >राम</text>

  <!-- "प्रभु रामजी ट्रस्ट" -->
  <text 
    x="512" 
    y="780" 
    font-family="'Noto Sans Devanagari', 'Noto Serif Devanagari', 'Mangal', 'Poppins', sans-serif" 
    font-size="48" 
    font-weight="700" 
    fill="#fff2b3" 
    text-anchor="middle"
    letter-spacing="4"
    filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.8))"
  >प्रभु रामजी ट्रस्ट</text>

  <!-- Circular Bottom Arc Text "ग्राम गलगाँव (सनावद, खरगोन, म.प्र.)" -->
  <text 
    font-family="'Noto Sans Devanagari', 'Noto Serif Devanagari', 'Mangal', sans-serif" 
    font-size="34" 
    font-weight="600" 
    fill="#e6be65" 
    letter-spacing="3"
    opacity="0.95"
  >
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      ग्राम गलगाँव (सनावद, खरगोन, म.प्र.)
    </textPath>
  </text>
</svg>
